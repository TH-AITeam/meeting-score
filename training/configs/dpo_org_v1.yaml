model:
  id: "{{ llm_model }}"
  max_seq_len: 4096

dataset:
  org_id: "{{ org_id }}"
  train_jsonl: "data/training/org_feedback/{{ org_id }}/dpo_train.jsonl"

dpo:
  beta: 0.1
  learning_rate: 5.0e-7
  incremental_learning_rate: 1.6666667e-7
  epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  weight_decay: 0.01

lora:
  r: 16
  alpha: 16
  dropout: 0.0

output:
  adapters_root: "adapters"
