[project]
name = "meeting-score"
version = "0.1.0"
description = "会議中の各発言が会議をどれだけ前進させたかを評価・可視化する MVP"
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "openai>=1.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "uvicorn[standard]>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
