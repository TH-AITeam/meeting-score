[project]
name = "meeting-score"
version = "0.1.0"
description = "会議中の各発言の会議貢献度を評価・可視化する MVP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "numpy>=2.4.6",
    # openai SDK: ローカル推論バックエンド (vLLM 等) を OpenAI 互換 API で叩くために
    # `base_url` 差し替えで使用する。OpenAI クラウドへの依存は撤去済 (Issue #17) で、
    # 本番運用は OPENAI_API_KEY なしで動く。OpenAI クラウド (Responses API) を叩くのは
    # 蒸留データ生成 (Issue #12) やベンチマーク比較の optional 用途のみ。
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.29",
    "pyyaml>=6.0.1",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.48.0",
    "wandb>=0.27.0",
]

# Issue #19 の音声処理 (WhisperX + pyannote + librosa) は重い依存なので
# 既定の uv sync では入れず、`uv sync --extra audio` で明示的に導入する。
[project.optional-dependencies]
audio = [
    "librosa>=0.10",
    "pyannote-audio>=3.1",
    "soundfile>=0.12",
    "whisperx>=3.8.6",
]
postgres = [
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["data", "checkpoints", ".venv"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "N",    # pep8-naming
]
ignore = [
  "E501",   # line too long (formatter が処理)
  "RUF002", # 日本語ドキュメント文字列の全角記号は意図的
  "RUF003", # 日本語コメントの全角記号は意図的
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = ["data/", "checkpoints/"]

# Issue #19 の audio extras は optional 依存。未導入環境でも型チェックが通るように
# stub を提供しないライブラリは missing imports を許容する。
[[tool.mypy.overrides]]
module = [
    "librosa",
    "librosa.*",
    "pyannote",
    "pyannote.*",
    "torch",
    "torch.*",
    "whisperx",
    "whisperx.*",
]
ignore_missing_imports = true
