# 会議貢献度スコアリング設定ファイル

# スコアリング重み
weights:
  # 主評価軸
  issue_clarification: 1.3    # 論点整理
  decision_progress: 1.5      # 意思決定寄与
  risk_detection: 1.2         # リスク検知
  actionability: 1.3          # アクション化
  # 補助評価軸
  groundedness: 0.8           # 根拠性
  novelty: 0.9                # 新規性/洞察
  summarization: 0.8          # 要約・交通整理

# 減点軸（重みは1.0固定、値自体が負）
penalties:
  duplication: 1.0            # 重複
  verbosity: 1.0              # 冗長
  off_topic: 1.0              # 論点逸脱
  unsupported_assertion: 1.0  # 根拠薄い断言
  override: 0.5               # 上書き発言

# 文脈ウィンドウ設定
context:
  before_count: 3             # 直前の発言数
  after_count: 3              # 直後の発言数

# LLM 設定 (Issue #12 + Issue #17)
# 本番運用は local バックエンド (vLLM など OpenAI 互換サーバ)。
# OpenAI Responses API は蒸留データ生成 (Issue #12) やベンチマーク比較でのみ使う。
#   - local  : OpenAI 互換エンドポイント (vLLM など) — 既定
#   - openai : OpenAI Responses API — optional (蒸留・ベンチ用途)
llm:
  backend: "local"                  # local | openai
  model: "qwen3.6-35b-nvfp4"        # local では vLLM の --served-model-name と一致させる
  endpoint: "http://localhost:8001/v1"  # backend=local 時に必須
  api_key: null                    # OpenAI 互換サーバが要求する場合のみ。OpenAI は環境変数 OPENAI_API_KEY
  max_tokens: 1024
  max_retries: 3
  timeout: 60                      # 秒。35B (NVFP4) は p50 ~7s のため余裕を持たせる

# 会議タイプ別重み (Issue #64)
# 未指定時は上記 weights をフォールバックとして使用する
meeting_type_weights:
  decision:                      # 意思決定会議
    issue_clarification: 1.2
    decision_progress: 1.8
    risk_detection: 1.4
    actionability: 1.3
    groundedness: 1.2
    novelty: 0.6
    summarization: 0.8
  brainstorming:                 # ブレスト会議
    issue_clarification: 1.2
    decision_progress: 0.7
    risk_detection: 0.7
    actionability: 0.8
    groundedness: 0.9
    novelty: 1.8
    summarization: 0.8
  progress:                      # 進捗共有・定例
    issue_clarification: 1.0
    decision_progress: 1.0
    risk_detection: 1.4
    actionability: 1.6
    groundedness: 1.0
    novelty: 0.5
    summarization: 1.3
  retrospective:                 # 振り返り・レビュー
    issue_clarification: 1.4
    decision_progress: 0.8
    risk_detection: 1.5
    actionability: 1.2
    groundedness: 1.4
    novelty: 0.8
    summarization: 1.3

# 集計設定
aggregation:
  top_utterances_count: 5     # Top発言数
  top_per_axis_count: 3       # 軸別Top発言数

# 音声処理設定 (Issue #19, Proposed)
# 採用候補: ASR=WhisperX (whisper-large-v3) + Diar=pyannote/speaker-diarization-3.1 + 音量分析
# 実本実装は Issue #11 で完成予定。本セクションは Issue #11 が config から読む雛形。
audio:
  asr:
    backend: "whisperx"                         # whisperx (現状唯一の候補)
    model_name: "large-v3"                       # faster-whisper model id。kotoba-tech/kotoba-whisper-v2.0 で差替え可
    device: "cuda"                              # cuda / cpu
    compute_type: "float16"                     # float16 / int8_float16 / int8
    language: "ja"
    batch_size: 16
    align_model: null                           # 例: jonatasgrosman/wav2vec2-large-xlsr-53-japanese
  diarization:
    backend: "pyannote"                         # pyannote (現状唯一の候補)
    model_name: "pyannote/speaker-diarization-3.1"
    device: "cuda"
    hf_token_env: "HUGGINGFACE_HUB_TOKEN"        # gated repo アクセス。値は環境変数に置く
    default_num_speakers: null                  # null=自動推定、整数=固定
    detect_overlap: true
  volume:
    enabled: true
    silent_below: 0.005                         # RMS 閾値 (linear)
    low_below: 0.02
    high_above: 0.10
  pipeline:
    overlap_iou_threshold: 0.3                  # 別話者 turn との IoU がこの値以上なら overlap_with に追加
