# 会議貢献度スコアリング設定

weights:
  issue_clarification: 1.3
  decision_progress: 1.5
  risk_detection: 1.2
  actionability: 1.3
  groundedness: 0.8
  novelty: 0.9
  summarization: 0.8

penalties:
  duplication: 1.0
  verbosity: 1.0
  off_topic: 1.0
  unsupported_assertion: 1.0

context:
  before_count: 3
  after_count: 3

llm:
  model: "gpt-5.4-mini"
  max_tokens: 1024
  max_retries: 3

aggregation:
  top_utterances_count: 5
  top_per_axis_count: 3
