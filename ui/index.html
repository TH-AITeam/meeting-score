<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会議貢献度スコアリング</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Meeting Score</p>
      <h1>会議貢献度スコアリング</h1>
    </div>
    <button class="button button-ghost hidden" id="resetBtn" type="button">新しい分析</button>
  </header>

  <nav class="tabs hidden" id="tabBar" aria-label="分析結果の表示切り替え">
    <button class="tab active" type="button" data-tab="summary">サマリー</button>
    <button class="tab" type="button" data-tab="timeline">発言タイムライン</button>
    <button class="tab" type="button" data-tab="speakers">話者別</button>
  </nav>

  <main class="shell">
    <section class="input-view" id="inputView">
      <div class="intro">
        <h2>会議ログを分析</h2>
        <p>文字起こし JSON を読み込み、会議を前に進めた発言や改善のヒントを可視化します。</p>
      </div>

      <div class="input-grid">
        <label class="upload-panel" id="uploadArea">
          <input type="file" id="fileInput" accept=".json">
          <span class="upload-title">JSONファイルを選択</span>
          <span class="upload-subtitle">クリックしてアップロード</span>
        </label>

        <section class="sample-panel" aria-labelledby="sampleTitle">
          <div class="panel-heading">
            <h3 id="sampleTitle">サンプル</h3>
            <span id="sampleCount">読み込み中</span>
          </div>
          <div class="sample-list" id="sampleList"></div>
        </section>
      </div>
    </section>

    <section class="loading-view hidden" id="loadingView" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="progressText">分析を開始しています...</p>
    </section>

    <section class="result-view hidden" id="summaryView">
      <div class="summary-hero">
        <div>
          <p class="eyebrow">会議サマリー</p>
          <h2 id="meetingTitle"></h2>
          <p id="meetingGoal"></p>
        </div>
        <p class="overall-comment" id="overallComment"></p>
      </div>

      <section class="band">
        <div class="section-heading">
          <h3>会議を前に進めた発言</h3>
        </div>
        <div class="top-list" id="topUtterances"></div>
      </section>

      <section class="axis-grid">
        <div class="axis-panel">
          <h3>論点整理</h3>
          <div class="compact-list" id="topIssue"></div>
        </div>
        <div class="axis-panel">
          <h3>意思決定促進</h3>
          <div class="compact-list" id="topDecision"></div>
        </div>
        <div class="axis-panel">
          <h3>リスク検知</h3>
          <div class="compact-list" id="topRisk"></div>
        </div>
        <div class="axis-panel">
          <h3>アクション化</h3>
          <div class="compact-list" id="topAction"></div>
        </div>
      </section>

      <section class="band hidden" id="improvementSection">
        <div class="section-heading">
          <h3>改善のヒント</h3>
        </div>
        <div class="improvement-list" id="improvementComments"></div>
      </section>
    </section>

    <section class="result-view hidden" id="timelineView">
      <div class="section-heading">
        <h2>発言タイムライン</h2>
      </div>
      <div class="timeline-list" id="timelineList"></div>
    </section>

    <section class="result-view hidden" id="speakersView">
      <div class="section-heading">
        <h2>話者別サマリー</h2>
      </div>
      <div class="speakers-list" id="speakersList"></div>
    </section>
  </main>

  <template id="emptyTemplate">
    <p class="empty">該当する発言はありません。</p>
  </template>

  <script src="/js/app.js" defer></script>
</body>
</html>
