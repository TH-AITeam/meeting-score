<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会議貢献度スコアリング</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    header .subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 8px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .tab {
      padding: 8px 16px;
      border: none;
      background: none;
      font-size: 14px;
      cursor: pointer;
      border-radius: var(--radius);
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .tab:hover { background: var(--bg); }
    .tab.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }

    .card h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    /* 入力画面 */
    .input-section {
      text-align: center;
      padding: 48px 24px;
    }

    .input-section p {
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover { opacity: 0.9; }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--border); }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .sample-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }

    /* ローディング */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 48px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-text {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* スコアバッジ */
    .score-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .score-high { background: #dcfce7; color: #166534; }
    .score-mid { background: #fef9c3; color: #854d0e; }
    .score-low { background: #f1f5f9; color: #64748b; }
    .score-negative { background: #fee2e2; color: #991b1b; }

    .total-score {
      font-size: 20px;
      font-weight: 700;
    }

    /* タイプラベル */
    .type-label {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary);
    }

    .type-label[data-type="雑談/脱線"] { background: #fee2e2; color: #991b1b; }
    .type-label[data-type="懸念提示"] { background: #fff7ed; color: #9a3412; }
    .type-label[data-type="提案"] { background: #f0fdf4; color: #166534; }
    .type-label[data-type="意思決定促進"] { background: #faf5ff; color: #6b21a8; }
    .type-label[data-type="要約"] { background: #ecfdf5; color: #065f46; }

    /* スタイルラベル */
    .style-label {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      background: #f0f9ff;
      color: #0369a1;
    }

    /* 発言カード */
    .utterance-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }

    .utterance-card.highlight {
      border-color: var(--primary);
      border-width: 2px;
      background: #fafbff;
    }

    .utterance-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .utterance-speaker {
      font-weight: 700;
      font-size: 14px;
    }

    .utterance-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .utterance-text {
      font-size: 14px;
      margin-bottom: 8px;
      line-height: 1.7;
    }

    .utterance-reason {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 8px;
    }

    .scores-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .score-item {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bg);
    }

    /* 話者カード */
    .speaker-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }

    .speaker-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .speaker-name {
      font-size: 18px;
      font-weight: 700;
    }

    .speaker-stats {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* 棒グラフ */
    .bar-chart {
      margin-top: 12px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .bar-label {
      width: 100px;
      font-size: 12px;
      text-align: right;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 20px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--primary);
      transition: width 0.3s;
    }

    .bar-value {
      width: 40px;
      font-size: 12px;
      font-weight: 600;
    }

    /* 改善コメント */
    .improvement-item {
      padding: 12px 16px;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: var(--radius);
      margin-bottom: 8px;
      font-size: 14px;
    }

    /* Top発言リスト */
    .top-list { list-style: none; }

    .top-list li {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .top-list li:last-child { border-bottom: none; }

    .top-rank {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      min-width: 28px;
    }

    .top-content { flex: 1; }

    .top-speaker {
      font-weight: 600;
      font-size: 13px;
    }

    .top-text {
      font-size: 14px;
      margin: 4px 0;
    }

    .top-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ファイルアップロード */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s;
      margin-bottom: 24px;
    }

    .upload-area:hover { border-color: var(--primary); }

    .upload-area input { display: none; }

    .hidden { display: none !important; }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .container { padding: 12px; }
      .bar-label { width: 72px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>会議貢献度スコアリング</h1>
      <div class="subtitle">会議の振り返りと改善を支援するツール</div>
    </div>
    <button class="btn btn-secondary" id="resetBtn" style="display:none" onclick="resetApp()">新しい分析</button>
  </header>

  <div class="tabs" id="tabBar" style="display:none">
    <button class="tab active" data-tab="summary">会議サマリー</button>
    <button class="tab" data-tab="timeline">発言タイムライン</button>
    <button class="tab" data-tab="speakers">話者別分析</button>
  </div>

  <div class="container">
    <!-- 入力画面 -->
    <div id="inputView">
      <div class="card input-section">
        <h2>会議データを分析する</h2>
        <p>会議の文字起こしJSONをアップロードするか、サンプルデータで試してみてください。</p>

        <div class="upload-area" id="uploadArea">
          <input type="file" id="fileInput" accept=".json">
          <p>JSONファイルをクリックして選択</p>
          <p style="font-size:12px;color:var(--text-muted)">または下のサンプルデータをお使いください</p>
        </div>

        <div class="section-title">サンプルデータ</div>
        <div class="sample-list" id="sampleList">読み込み中...</div>
      </div>
    </div>

    <!-- ローディング -->
    <div id="loadingView" class="hidden">
      <div class="card loading">
        <div class="spinner"></div>
        <div class="progress-text" id="progressText">分析を開始しています...</div>
      </div>
    </div>

    <!-- 会議サマリー画面 -->
    <div id="summaryView" class="hidden">
      <div class="card">
        <h2 id="meetingTitle"></h2>
        <p style="color:var(--text-muted);margin-bottom:12px" id="meetingGoal"></p>
        <p id="overallComment"></p>
      </div>

      <div class="card">
        <h2>会議を前進させた発言 Top 5</h2>
        <ul class="top-list" id="topUtterances"></ul>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="card">
          <h3>論点を整理した発言</h3>
          <ul class="top-list" id="topIssue"></ul>
        </div>
        <div class="card">
          <h3>意思決定を進めた発言</h3>
          <ul class="top-list" id="topDecision"></ul>
        </div>
        <div class="card">
          <h3>リスクを可視化した発言</h3>
          <ul class="top-list" id="topRisk"></ul>
        </div>
        <div class="card">
          <h3>次アクションを明確にした発言</h3>
          <ul class="top-list" id="topAction"></ul>
        </div>
      </div>

      <div class="card" id="improvementSection">
        <h2>改善ポイント</h2>
        <div id="improvementComments"></div>
      </div>
    </div>

    <!-- 発言タイムライン画面 -->
    <div id="timelineView" class="hidden">
      <div id="timelineList"></div>
    </div>

    <!-- 話者別分析画面 -->
    <div id="speakersView" class="hidden">
      <div id="speakersList"></div>
    </div>
  </div>

  <script>
    const API_BASE = "/api";
    let currentData = null;

    // --- 初期化 ---
    async function init() {
      loadSamples();
      setupTabs();
      setupUpload();
    }

    async function loadSamples() {
      try {
        const res = await fetch(`${API_BASE}/samples`);
        const samples = await res.json();
        const el = document.getElementById("sampleList");
        if (samples.length === 0) {
          el.textContent = "サンプルデータがありません";
          return;
        }
        el.innerHTML = samples.map(s =>
          `<button class="btn btn-secondary" onclick="analyzeSample('${s.filename}')">${s.filename.replace('.json','')}</button>`
        ).join("");
      } catch (e) {
        document.getElementById("sampleList").textContent = "読み込みに失敗しました";
      }
    }

    function setupTabs() {
      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          showView(tab.dataset.tab);
        });
      });
    }

    function setupUpload() {
      const area = document.getElementById("uploadArea");
      const input = document.getElementById("fileInput");
      area.addEventListener("click", () => input.click());
      input.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          await analyzeData(data);
        } catch (e) {
          alert("JSONの読み込みに失敗しました: " + e.message);
        }
      });
    }

    // --- 分析実行 ---
    async function analyzeSample(filename) {
      showLoading();
      try {
        const res = await fetch(`${API_BASE}/analyze/sample/${filename}`, { method: "POST" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        currentData = await res.json();
        renderAll(currentData);
        showResults();
      } catch (e) {
        alert("分析に失敗しました: " + e.message);
        showInput();
      }
    }

    async function analyzeData(data) {
      showLoading();
      try {
        const res = await fetch(`${API_BASE}/analyze`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        currentData = await res.json();
        renderAll(currentData);
        showResults();
      } catch (e) {
        alert("分析に失敗しました: " + e.message);
        showInput();
      }
    }

    // --- 表示切替 ---
    function showLoading() {
      document.getElementById("inputView").classList.add("hidden");
      document.getElementById("loadingView").classList.remove("hidden");
      document.getElementById("tabBar").style.display = "none";
      document.getElementById("resetBtn").style.display = "none";
      animateProgress();
    }

    function showResults() {
      document.getElementById("loadingView").classList.add("hidden");
      document.getElementById("tabBar").style.display = "flex";
      document.getElementById("resetBtn").style.display = "inline-block";
      showView("summary");
    }

    function showInput() {
      document.getElementById("inputView").classList.remove("hidden");
      document.getElementById("loadingView").classList.add("hidden");
      document.getElementById("summaryView").classList.add("hidden");
      document.getElementById("timelineView").classList.add("hidden");
      document.getElementById("speakersView").classList.add("hidden");
      document.getElementById("tabBar").style.display = "none";
      document.getElementById("resetBtn").style.display = "none";
    }

    function showView(name) {
      ["summaryView", "timelineView", "speakersView"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
      document.getElementById(name + "View").classList.remove("hidden");
    }

    function resetApp() {
      currentData = null;
      showInput();
    }

    let progressInterval;
    function animateProgress() {
      const el = document.getElementById("progressText");
      const msgs = [
        "発言データを読み込んでいます...",
        "文脈ウィンドウを生成しています...",
        "各発言をAIで評価しています...",
        "スコアを計算しています...",
        "集計レポートを生成しています...",
      ];
      let i = 0;
      clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        el.textContent = msgs[i % msgs.length];
        i++;
      }, 3000);
    }

    // --- レンダリング ---
    function renderAll(data) {
      clearInterval(progressInterval);
      renderSummary(data);
      renderTimeline(data);
      renderSpeakers(data);
    }

    function scoreBadge(score) {
      let cls = "score-low";
      if (score >= 6) cls = "score-high";
      else if (score >= 3) cls = "score-mid";
      else if (score < 0) cls = "score-negative";
      return `<span class="score-badge ${cls}">${score}</span>`;
    }

    function renderTopList(container, items) {
      container.innerHTML = items.map((u, i) =>
        `<li>
          <div class="top-rank">${i + 1}</div>
          <div class="top-content">
            <span class="top-speaker">${u.speaker}</span>
            <span class="utterance-time">${u.timestamp}</span>
            ${scoreBadge(u.total_score)}
            <div class="top-text">${u.text}</div>
            <div class="top-meta">${u.reason}</div>
          </div>
        </li>`
      ).join("");
    }

    function renderSummary(data) {
      document.getElementById("meetingTitle").textContent = data.title;
      document.getElementById("meetingGoal").textContent = "目的: " + data.goal;
      document.getElementById("overallComment").textContent = data.overall_comment;

      renderTopList(document.getElementById("topUtterances"), data.top_utterances);
      renderTopList(document.getElementById("topIssue"), data.top_issue_clarification);
      renderTopList(document.getElementById("topDecision"), data.top_decision_progress);
      renderTopList(document.getElementById("topRisk"), data.top_risk_detection);
      renderTopList(document.getElementById("topAction"), data.top_actionability);

      const impEl = document.getElementById("improvementComments");
      if (data.improvement_comments.length === 0) {
        document.getElementById("improvementSection").classList.add("hidden");
      } else {
        document.getElementById("improvementSection").classList.remove("hidden");
        impEl.innerHTML = data.improvement_comments.map(c =>
          `<div class="improvement-item">${c}</div>`
        ).join("");
      }
    }

    function renderTimeline(data) {
      const container = document.getElementById("timelineList");
      const maxScore = Math.max(...data.evaluated_utterances.map(u => u.total_score), 1);
      const highlightThreshold = maxScore * 0.7;

      container.innerHTML = data.evaluated_utterances.map(u => {
        const isHighlight = u.total_score >= highlightThreshold && u.total_score > 3;
        const scoreItems = Object.entries(u.scores)
          .filter(([, v]) => v > 0)
          .map(([k, v]) => `<span class="score-item">${axisLabel(k)}: ${v}</span>`)
          .join("");
        const penaltyItems = Object.entries(u.penalties)
          .filter(([, v]) => v < 0)
          .map(([k, v]) => `<span class="score-item" style="background:#fee2e2">${penaltyLabel(k)}: ${v}</span>`)
          .join("");

        return `<div class="utterance-card ${isHighlight ? 'highlight' : ''}">
          <div class="utterance-header">
            <span class="utterance-speaker">${u.speaker}</span>
            <span class="utterance-time">${u.timestamp}</span>
            <span class="type-label" data-type="${u.speech_type}">${u.speech_type}</span>
            <span class="total-score">${scoreBadge(u.total_score)}</span>
          </div>
          <div class="utterance-text">${u.text}</div>
          <div class="utterance-reason">${u.reason}</div>
          <div class="scores-grid">${scoreItems}${penaltyItems}</div>
        </div>`;
      }).join("");
    }

    function renderSpeakers(data) {
      const container = document.getElementById("speakersList");
      const utteranceMap = {};
      data.evaluated_utterances.forEach(u => { utteranceMap[u.utterance_id] = u; });

      container.innerHTML = data.speaker_summaries.map(s => {
        const topUtts = s.top_utterances
          .map(id => utteranceMap[id])
          .filter(Boolean)
          .map(u => `<div class="utterance-card" style="margin-top:8px">
            <div class="utterance-header">
              <span class="utterance-time">${u.timestamp}</span>
              <span class="type-label" data-type="${u.speech_type}">${u.speech_type}</span>
              ${scoreBadge(u.total_score)}
            </div>
            <div class="utterance-text">${u.text}</div>
            <div class="utterance-reason">${u.reason}</div>
          </div>`).join("");

        return `<div class="speaker-card">
          <div class="speaker-header">
            <span class="speaker-name">${s.speaker}</span>
            <span class="style-label">${s.style_label}</span>
            <span class="speaker-stats">発言数: ${s.utterance_count} / 総合貢献スコア: ${s.total_contribution_score} / 平均: ${s.average_total_score}</span>
          </div>
          <div class="bar-chart">
            ${renderBarChart(s.average_scores)}
          </div>
          <h3 style="margin-top:16px">代表発言</h3>
          ${topUtts}
        </div>`;
      }).join("");
    }

    function renderBarChart(scores) {
      const axes = [
        ["issue_clarification", "論点整理"],
        ["decision_progress", "意思決定寄与"],
        ["risk_detection", "リスク検知"],
        ["actionability", "アクション化"],
        ["groundedness", "根拠性"],
        ["novelty", "新規性"],
        ["summarization", "要約整理"],
      ];
      return axes.map(([key, label]) => {
        const val = scores[key] || 0;
        const pct = (val / 3) * 100;
        return `<div class="bar-row">
          <div class="bar-label">${label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-value">${val.toFixed(1)}</div>
        </div>`;
      }).join("");
    }

    function axisLabel(key) {
      const map = {
        issue_clarification: "論点整理",
        decision_progress: "意思決定",
        risk_detection: "リスク",
        actionability: "アクション",
        groundedness: "根拠性",
        novelty: "新規性",
